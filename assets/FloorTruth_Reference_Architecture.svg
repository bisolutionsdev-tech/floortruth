<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="FloorTruth reference architecture diagram">
<defs><style><![CDATA[
.title{font:bold 44px 'Arial',sans-serif;fill:#f0f7f7}.subtitle{font:21px 'Arial',sans-serif;fill:#a4b8c1}.lbl{font:bold 20px 'Arial',sans-serif;fill:#5ce4bc}.h{font:bold 27px 'Arial',sans-serif;fill:#f0f7f7}.t{font:20px 'Arial',sans-serif;fill:#b9cad1}.sm{font:17px 'Arial',sans-serif;fill:#8eaab5}.note{font:17px 'Arial',sans-serif;fill:#e8cc92}.arrow{stroke:#5ce4bc;stroke-width:4;fill:none;marker-end:url(#arrowhead)}
]]></style><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5ce4bc"/></marker></defs>
<rect width="1600" height="900" fill="#0b121c"/><rect width="1600" height="6" fill="#5ce4bc" opacity=".6"/><text x="80" y="89" class="title">FloorTruth · Governed organizational learning</text><text x="82" y="132" class="subtitle">Original, vendor-neutral reference architecture · synthetic demonstration only</text>
<g transform="translate(72,220)"><rect x="0" y="0" width="315" height="390" rx="20" fill="#142633" stroke="#314654" stroke-width="2"/><text x="25" y="46" class="lbl">01  EXPERIENCE</text><text x="25" y="105" class="h">Frontline + reviewer</text><text x="25" y="158" class="t">Voluntary text / voice</text><text x="25" y="203" class="t">Source-linked case review</text><text x="25" y="248" class="t">Human decision gate</text><text x="25" y="293" class="t">Impact dashboard</text><text x="25" y="354" class="sm">Progressive disclosure</text></g>
<g transform="translate(456,220)"><rect x="0" y="0" width="315" height="390" rx="20" fill="#142633" stroke="#314654" stroke-width="2"/><text x="25" y="46" class="lbl">02  APPLICATION</text><text x="25" y="105" class="h">Governed service</text><text x="25" y="158" class="t">Validation + sensitivity</text><text x="25" y="203" class="t">Case state machine</text><text x="25" y="248" class="t">Permission / review gate</text><text x="25" y="293" class="t">Recovery + audit events</text><text x="25" y="354" class="sm">Deterministic enforcement</text></g>
<g transform="translate(840,220)"><rect x="0" y="0" width="315" height="390" rx="20" fill="#142633" stroke="#314654" stroke-width="2"/><text x="25" y="46" class="lbl">03  EVIDENCE + AI</text><text x="25" y="105" class="h">Hypotheses, not facts</text><text x="25" y="158" class="t">Observation provenance</text><text x="25" y="203" class="t">Correlations + alternative H</text><text x="25" y="248" class="t">Meta Muse Spark adapter</text><text x="25" y="293" class="t">Disconfirming tests</text><text x="25" y="354" class="sm">Optional provider, advisory only</text></g>
<g transform="translate(1224,220)"><rect x="0" y="0" width="315" height="390" rx="20" fill="#142633" stroke="#314654" stroke-width="2"/><text x="25" y="46" class="lbl">04  MEASUREMENT</text><text x="25" y="105" class="h">Outcomes + learning</text><text x="25" y="158" class="t">Controlled pilot design</text><text x="25" y="203" class="t">Baseline + comparator</text><text x="25" y="248" class="t">ROI assumptions</text><text x="25" y="293" class="t">Reviewed knowledge record</text><text x="25" y="354" class="sm">No unsupported causal claim</text></g>
<path d="M 390 416 L 446 416" class="arrow"/><path d="M 774 416 L 830 416" class="arrow"/><path d="M 1158 416 L 1214 416" class="arrow"/>
<rect x="80" y="670" width="1440" height="115" rx="19" fill="#15312d" stroke="#427a69" stroke-width="2"/><text x="108" y="710" class="lbl">CROSS-CUTTING RESEARCH INVARIANTS</text><text x="109" y="751" class="t">Provenance   ·   Privacy   ·   Human optionality   ·   Competing hypotheses   ·   Recoverability   ·   Provider neutrality</text>
<text x="80" y="852" class="note">Model proposes · Humans govern · Evidence adjudicates · Validated outcomes inform the next iteration</text>
</svg>
